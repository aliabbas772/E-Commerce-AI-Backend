server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: ecommerce-server
    static_configs:
      - targets:
          - localhost
        labels:
          job: ecommerce-server
          service: server
          __path__: /var/log/server/*.log

  - job_name: ecommerce-worker
    static_configs:
      - targets:
          - localhost
        labels:
          job: ecommerce-worker
          service: worker
          __path__: /var/log/worker/*.log
