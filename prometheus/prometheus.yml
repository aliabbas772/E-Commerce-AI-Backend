global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9095

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: 'ecommerce-server'
    static_configs:
      - targets: ['server:4000']
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']